#
# /etc/input-event-daemon.conf
#

[Global]
listen = /dev/input/event0
listen = /dev/input/event1

[Keys]
# HP Prime G1 Hardware Power, Reset & Korean Virtual Keyboard Controls
# [Shift] + [On] -> Safe Poweroff (Backlight Off, USB Charging Mode, CPU SLEEP)
SHIFT+OK     = /usr/sbin/hpp-poweroff
# [Alpha] + [On] -> Safe Reboot (Reset)
CAPSLOCK+OK  = sync; /sbin/reboot
# [Menu] -> Toggle Korean/English Touchscreen Virtual Keyboard (hpp-vkbd)
MENU         = /usr/bin/hpp-vkbd-toggle

MUTE         = amixer -q set Master mute
CTRL+ALT+ESC = beep

[Switches]
RADIO:0 = ifconfig wlan0 down

[Idle]
1h 30m = vbetool dpms off
reset  = vbetool dpms on

